<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Up Next | Tyler Robertson</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="images/websiteImages/PortfolioWebsiteIcon.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .up-next-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            font-family: 'Urbanist', sans-serif;
        }

        /* Featured Show Styling */
        .featured-next {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            background: #f4f4f4;
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 60px;
            align-items: center;
        }

        .featured-poster img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .featured-info h3 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .featured-info .date-location {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* Upcoming Grid */
        .upcoming-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .upcoming-card {
            text-align: center;
            transition: 0.3s ease;
        }

        .upcoming-card img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .upcoming-card h4 {
            font-size: 1.4rem;
            margin: 5px 0;
        }

        .upcoming-card p {
            color: #777;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            .featured-next {
                grid-template-columns: 1fr;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <nav class="left-header">
        <a href="index.html">Home</a>
        <a href="resume.html">Resume</a>
        <a href="upnext.html">Up Next</a>
    </nav>

    <h1 class="title">Tyler Robertson</h1>

    <nav class="right-header">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="heading">
    <h2>Current & Upcoming Projects</h2>
</section>

<main class="up-next-container">

    <section class="upcoming-grid">
        
        <div class="upcoming-card">
            <h4>Stay tuned for more updates!</h4>
        </div>

    </section>

</main>

</body>
</html>
