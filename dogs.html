<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery | Tyler Robertson</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="images/websiteImages/PortfolioWebsiteIcon.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            font-family: 'Urbanist', sans-serif;
        }

        /* Container for each pair of images */
        .gallery-row {
            display: flex;
            gap: 40px;
            margin-bottom: 60px; /* Space between the two rows */
            justify-content: center;
        }

        .gallery-item {
            flex: 1;
            text-align: center;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: block;
            margin-bottom: 15px;
            transition: transform 0.3s ease; /* Subtle hover effect */
        }

        .gallery-item img:hover {
            transform: translateY(-5px);
        }

        .image-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .gallery-row {
                flex-direction: column;
                gap: 40px;
                margin-bottom: 40px;
            }
            .gallery-item {
                max-width: 500px;
                margin: 0 auto;
            }
        }
    </style>
</head>

<body>

<header>
    <nav class="left-header">
        <a href="index.html">Home</a>
        <a href="resume.html">Resume</a>
        <a href="upnext.html">Up Next</a>
    </nav>

    <h1 class="title">Tyler Robertson</h1>

    <nav class="right-header">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main class="gallery-container">
    
    <!-- First Row -->
    <div class="gallery-row">
        <div class="gallery-item">
            <img src="images/AboutStuff/dogs/bigElla1.jpeg" alt="Description">
            <div class="image-label">Ella</div>
        </div>

        <div class="gallery-item">
            <img src="images/AboutStuff/dogs/bigElla2.jpeg" alt="Description">
            <div class="image-label">Ella</div>
        </div>
    </div>

    <!-- Second Row -->
    <div class="gallery-row">
        <div class="gallery-item">
            <img src="images/row2-image1.jpg" alt="Description">
            <div class="image-label">Label Three</div>
        </div>

        <div class="gallery-item">
            <img src="images/row2-image2.jpg" alt="Description">
            <div class="image-label">Label Four</div>
        </div>
    </div>

</main>

</body>
</html>
